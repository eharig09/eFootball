services:
  - type: web
    name: cfb_intelligence
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    # One worker/thread leaves the most headroom on the constrained web service.
    # The rendered-page cache is disk-backed, so recycling the worker more often
    # bounds Python heap growth without throwing away warmed page output.
    startCommand: gunicorn --workers 1 --threads 1 --timeout 120 --max-requests 200 --max-requests-jitter 25 run:app
    # The old /api/v1/cfb/status probe performs several database summaries. The
    # home shell is a much cheaper liveness check and avoids background DB work.
    healthCheckPath: /
    envVars:
      - key: REGISTER_LEGACY_DASHBOARDS
        value: "0"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
      # Request pages read reporting already stored by the background ingestion
      # jobs. Do not create network-fetch thread pools inside the web worker.
      - key: CFB_LIVE_RSS_ENABLED
        value: "0"
      - key: LIVE_RSS_CACHE_SECONDS
        value: "3600"
      # Prevent numerical libraries from creating extra CPU-hungry worker threads
      # on the 0.5-CPU Render instance.
      - key: OMP_NUM_THREADS
        value: "1"
      - key: OPENBLAS_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: NUMEXPR_NUM_THREADS
        value: "1"
      - key: CFB_REFRESH_CHILD_MB
        value: "200"
      # Rendered CFB pages are CPU-heavy but change much less often than requests.
      # Keep them for an hour and let refresh writes invalidate at most once per
      # hour instead of invalidating the whole page cache after every SQLite write.
      - key: CFB_PAGE_CACHE_SECONDS
        value: "3600"
      - key: CFB_PAGE_CACHE_DATA_VERSION_SECONDS
        value: "3600"
      - key: CFB_PAGE_CACHE_DIR
        value: /var/data/page_cache
      - key: CFB_PAGE_CACHE_THRESHOLD
        value: "600"
      - key: CFB_REFRESH_TIMEZONE
        value: America/New_York
      # Keep live Saturday updates useful without running CFBD games, box scores,
      # and lines every hour on the constrained web instance.
      - key: CFB_LIVE_REFRESH_EVERY_HOURS
        value: "2"
      # Seven bounded maintenance segments/day: core twice, content twice, and
      # roster/stats/models once each. News gets three separate shards below.
      - key: CFB_REFRESH_HOURS
        value: 2,6,10,12,16,18,22,23
      - key: CFB_REFRESH_HEAVY_HOURS
        value: ""
      - key: CFB_REFRESH_CORE_HOURS
        value: 6,18
      - key: CFB_REFRESH_CONTENT_HOURS
        value: 10,16
      - key: CFB_REFRESH_ROSTER_HOURS
        value: "12"
      - key: CFB_REFRESH_STATS_HOURS
        value: "22"
      - key: CFB_REFRESH_MODEL_HOURS
        value: "23"
      # Play-by-play and everything derived from it. Nothing ran these in
      # production: no segment named them, and asking the hook for "heavy"
      # lands on the core segment. Given the quietest hour of the day because
      # they are the most expensive steps in the refresh.
      - key: CFB_REFRESH_ANALYTICS_HOURS
        value: "2"
      - key: CFB_REFRESH_NEWS_HOURS
        value: 3,8,20
      - key: CFB_LOCAL_NEWS_SHARD_SIZE
        value: "25"
      - key: CFB_DATABASE_PATH
        value: /var/data/cfb.sqlite3
      - key: CFBD_RAW_CACHE_PATH
        value: /var/data/cfbd_raw
      - key: NFL_DATABASE_PATH
        value: /var/data/nfl.sqlite3
      - key: NFLVERSE_RAW_CACHE_PATH
        value: /var/data/nflverse_raw
      # The disk is unavailable during Render build/pre-deploy commands. The
      # live worker therefore launches a lock-safe, one-time population helper
      # only while the NFL database is empty.
      - key: NFL_AUTO_SEED
        value: "1"
      - key: NFL_PFF_SOURCE_ROOT
        value: /var/data/nfl_pff
      - key: SPORTSDATAVERSE_CACHE_PATH
        value: /var/data/sportsdataverse
      - key: CFB_WEATHER_CACHE_PATH
        value: /var/data/weather
      - key: CFB_REFRESH_TOKEN
        sync: false
      # Human admin actions can use a short PIN instead of exposing the refresh
      # token. Set this once in Render; the browser remembers it locally.
      - key: CFB_ADMIN_PIN
        sync: false
    disk:
      name: cfb-data
      mountPath: /var/data
      sizeGB: 5

  - type: cron
    name: cfb-refresh-trigger
    runtime: python
    # The trigger checks hourly so odd-hour maintenance jobs are still reachable;
    # live-game work itself is throttled to every two hours by the web service.
    schedule: "0 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m sports_aggregator.render_trigger
    envVars:
      - key: CFB_REFRESH_URL
        sync: false
      - key: CFB_REFRESH_TOKEN
        sync: false
      - key: CFB_REFRESH_TIMEZONE
        value: America/New_York
