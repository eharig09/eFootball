name: Manual CFB Projection Refresh

on:
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger projections refresh on Render
        env:
          CFB_REFRESH_URL: ${{ secrets.CFB_REFRESH_URL }}
          CFB_REFRESH_TOKEN: ${{ secrets.CFB_REFRESH_TOKEN }}
        run: |
          if [ -z "$CFB_REFRESH_URL" ] || [ -z "$CFB_REFRESH_TOKEN" ]; then
            echo "Missing CFB_REFRESH_URL or CFB_REFRESH_TOKEN repository secret."
            exit 1
          fi
          curl --fail-with-body --show-error --silent \
            -X POST \
            -H "Authorization: Bearer $CFB_REFRESH_TOKEN" \
            "${CFB_REFRESH_URL}?profile=light&segment=projections"
